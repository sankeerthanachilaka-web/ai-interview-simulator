{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="container py-5"><div class="section-card mx-auto" style="max-width:760px"><span class="eyebrow">PROFILE</span><h1 class="fw-bold mt-2">Your account</h1><form method="post" class="mt-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Full Name</label><input class="form-control form-control-lg" name="name" value="{{ current_user.name }}" required></div><div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-lg" value="{{ current_user.email }}" disabled></div><div class="small text-secondary mb-4">Joined {{ current_user.created_at.strftime("%d %B %Y") }}</div><button class="btn btn-primary">Save changes</button></form></div></div>
{% endblock %}
