{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="text-center mb-4"><div class="brand-mark large">AI</div><h2 class="fw-bold mt-3">Create your account</h2><p class="text-secondary">Build an interview practice history that grows with you.</p></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control form-control-lg" name="name" required autocomplete="name"></div>
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" minlength="8" required autocomplete="new-password"><div class="form-text">At least 8 characters with letters and numbers.</div></div>
    <div class="mb-4"><label class="form-label">Confirm Password</label><input class="form-control form-control-lg" type="password" name="confirm_password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-lg w-100">Create Account</button>
  </form>
  <p class="text-center text-secondary mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>
{% endblock %}
