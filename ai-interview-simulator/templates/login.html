{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="text-center mb-4"><div class="brand-mark large">AI</div><h2 class="fw-bold mt-3">Welcome back</h2><p class="text-secondary">Continue your interview preparation.</p></div>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email</label><input class="form-control form-control-lg" type="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label">Password</label><input class="form-control form-control-lg" type="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-lg w-100">Login</button>
  </form>
  <p class="text-center text-secondary mt-4 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>
{% endblock %}
